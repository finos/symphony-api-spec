openapi: 3.0.3
info:
  title: SBE Users API
  description: |-
    Users related API
  version: 5.5.0
externalDocs:
  description: Overall Symphony public API
  url: https://rest-api.symphony.com/
servers:
  - url: https://yourpodURL.symphony.com
tags:
  - name: Apps
    description: App users and entitlements API
  - name: Groups
    description: Groups API
  - name: SbeUsers
    description: User listing and filtering API
paths:
  /v1/groups/sdl/{groupId}:
    get:
      tags:
        - Groups
      summary: Get SDL group information
      deprecated: true
      operationId: getSDLGroupById
      parameters:
        - name: sessionToken
          in: header
          required: true
          schema:
            type: string
            description: Session authentication token.
        - name: groupId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/GroupId'
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        400:
          $ref: '#/components/responses/ClientError'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/GroupNotFound'
        500:
          $ref: '#/components/responses/ServerError'
  /v1/groups/sdl/list:
    get:
      tags:
        - Groups
      summary: List SDL groups ordered by id
      deprecated: true
      operationId: listSDLGroups
      parameters:
        - name: sessionToken
          in: header
          required: true
          schema:
            type: string
            description: Session authentication token.
        - name: lastGroupId
          in: query
          schema:
            $ref: "#/components/schemas/GroupId"
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
          description: Number of Groups provided in response.
        - name: username
          in: query
          description: Filter groups by exact username match.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: name
          in: query
          description: Filter groups by exact name match.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupResponse'
        400:
          $ref: '#/components/responses/ClientError'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        500:
          $ref: '#/components/responses/ServerError'
  /v5/users/apps/{groupAppId}:
    get:
      tags:
        - Apps
      summary: List users application visibility and entitlements.
      description: Lists users with application, visiblity and subscription entitlements.
      operationId: findAppUsers
      x-spring-paginated: true
      parameters:
        - name: sessionToken
          in: header
          required: true
          schema:
            type: string
            description: App session authentication token.
        - name: groupAppId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: installed
          in: query
          required: false
          schema:
            type: boolean
            description: Filter users with app installed
      responses:
        '200':
          description: Paged List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUsersResponse'
        '400':
          $ref: '#/components/responses/ClientError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: App not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageWithCode'
        '500':
          $ref: '#/components/responses/ServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /v5/users/current/clientdata:
    get:
      tags:
        - SbeUsers
      summary: Retrieve authenticated user's client data
      description: Retrieves folders, workspaces, and distribution lists for the authenticated user.
      operationId: getClientData
      parameters:
        - name: sessionToken
          in: header
          required: true
          schema:
            type: string
            description: Session authentication token.
        - name: appId
          in: query
          description: Application ID to retrieve client data for, defaults to symphonyPrime.
          required: false
          schema:
            type: string
            default: symphonyPrime
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDataResponse'
        '404':
          description: Client data not found
  /v5/users:
    get:
      tags:
        - SbeUsers
      summary: Users Lookup
      description: Look up users by uids, emails, or usernames.
      operationId: lookupUsers
      parameters:
        - name: sessionToken
          in: header
          required: true
          schema:
            type: string
            description: Session authentication token.
        - name: uid
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
          description: List of user IDs as decimal integers.
        - name: email
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
          description: List of email addresses.
        - name: username
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
          description: List of usernames.
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by user status (active/inactive).
      responses:
        '200':
          description: Search completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLookupList'
        '204':
          description: No user found matching the criteria.
        '400':
          $ref: '#/components/responses/ClientError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v5/users/list:
    get:
      tags:
        - SbeUsers
      summary: List users of a tenant.
      description: Lists users of the tenant with filtering and pagination.
      operationId: listUsers
      parameters:
        - name: sessionToken
          in: header
          required: true
          schema:
            type: string
            description: Session authentication token.
        - name: limit
          in: query
          description: Maximum number of records to return.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: lastUserId
          in: query
          description: Id of the last user received in the previous page. Only users with a greater id are returned.
          required: false
          schema:
            type: integer
            format: int64
        - name: roles
          in: query
          description: Only return users having at least one of these role ids
          required: false
          schema:
            type: array
            items:
              type: string
        - name: userId
          in: query
          description: Only return the user with this id.
          required: false
          schema:
            $ref: '#/components/schemas/UserId'
        - name: active
          in: query
          description: If true only active users are returned, if false only inactive ones, if absent both.
          required: false
          schema:
            type: boolean
        - name: createdDateFrom
          in: query
          description: Only return users created at or after this time, in Unix epoch milliseconds.
          required: false
          schema:
            type: integer
            format: int64
        - name: createdDateTo
          in: query
          description: Only return users created before this time, in Unix epoch milliseconds.
          required: false
          schema:
            type: integer
            format: int64
        - name: enabledEntitlements
          in: query
          description: >-
            Only return users having all of these boolean entitlements enabled
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: disabledEntitlements
          in: query
          description: >-
            Only return users having all of these boolean entitlements disabled
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
      responses:
        '200':
          description: Paged list of tenant users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserArrayResponse'
        '400':
          $ref: '#/components/responses/ClientError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  responses:
    ClientError:
      description: Client error, see response body for further details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageWithCode"
    Forbidden:
      description: Forbidden, Caller lacks necessary entitlement.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageWithCode"
    NoContent:
      description: Not content.
    Ok:
      description: Ok
    ServerError:
      description: Server error, see response body for further details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageWithCode"
    Unauthorized:
      description: Unauthorized, Invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageWithCode"
    UserNotFound:
      description: Not found, user id cannot be located.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageWithCode"
    NotImplemented:
      description: Not Implemented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageWithCode"
    GroupNotFound:
      description: Not found, group cannot be located.

  schemas:
    GroupId:
      description: Group identifier.
      type: integer
      format: int64
      minimum: 1
      example: 71811853191697
    GroupResponse:
      description: Group account's base properties.
      type: object
      properties:
        groupId:
          $ref: "#/components/schemas/GroupId"
        name:
          type: string
          description: Group name.
        username:
          type: string
          description: Username identificatior of the Group.
        type:
          type: string
          description: Group type.
          enum:
            - SDL
        active:
          type: boolean
          description: Define if group is currently active or deleted.
        displayName:
          type: string
          description: Display name.
        companyName:
          type: string
          description: Company name.
        email:
          type: string
          description: Email address.
        members:
          type: array
          description: Group account's members.
          items:
            $ref: '#/components/schemas/GroupMember'
        restrictedTenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantId"
        avatars:
          $ref: "#/components/schemas/Images"
        eTag:
          type: string
          description: Group account's eTag.
        createdDate:
          type: integer
          format: int64
          description: Group account's creation timestamp (Unix epoch milliseconds).
        createdBy:
          type: string
          description: Group account's creator.
        updatedDate:
          type: integer
          format: int64
          description: Group account's last modification timestamp (Unix epoch milliseconds).
        updatedBy:
          type: string
          description: Group account's updater.
        marketCoverage:
          type: array
          items:
            type: string
        instrument:
          type: array
          items:
            type: string
        responsibility:
          type: array
          items:
            type: string
        function:
          type: array
          items:
            type: string
    GroupMember:
      description: A member of a group account.
      type: object
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
        tenantId:
          type: integer
          format: int32
          description: Member's tenant identifier.
        addedDate:
          type: integer
          format: int64
          description: Timestamp when the member was added (Unix epoch milliseconds).
    UserId:
      type: integer
      format: int64
      minimum: 1
      example: 71811853191697
    MessageWithCode:
      properties:
        code:
          type: integer
          format: int32
          example: 505
        message:
          type: string
          example: "Operation not supported"
    AppUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AppUser'
        page:
          $ref: '#/components/schemas/PageMeta'
    Images:
      properties:
        50:
          type: string
        150:
          type: string
        500:
          type: string
        600:
          type: string
        orig:
          type: string
    TenantId:
      type: integer
      format: int32
      minimum: 1
      example: 1008
    AppUser:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        enable:
          type: boolean
        listed:
          type: boolean
        product:
          $ref: '#/components/schemas/AppSubscription'
      required:
        - userId
        - listed

    AppSubscription:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          example: "default"
        subscribed:
          type: boolean
        sku:
          type: string
          example: "123"
          nullable: false
      required:
        - name
        - type
        - subscribed

    DirectionEnum:
      type: string
      enum:
        - ASC
        - DESC
    Sort:
      type: object
      properties:
        property:
          type: string
          description: The property to sort by.
        direction:
          $ref: '#/components/schemas/DirectionEnum'
    PageMeta:
      type: object
      description: Metadata about the paginated response.
      properties:
        size:
          type: integer
          description: The number of items in the current page.
        number:
          type: integer
          description: The page number (0-based).
        totalElements:
          type: integer
          format: int64
          description: The total number of items available.
        totalPages:
          type: integer
          description: The total number of pages available.
        first:
          type: boolean
          description: True if this is the first page.
        last:
          type: boolean
          description: True if this is the last page.
        hasNext:
          type: boolean
          description: True if there is a next page.
        hasPrevious:
          type: boolean
          description: True if there is a previous page.
        sort:
          type: array
          items:
            $ref: '#/components/schemas/Sort'
    ClientDataResponse:
      type: object
      properties:
        folders:
          type: array
          items:
            $ref: '#/components/schemas/ClientDataStructure'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/ClientDataStructure'
        distributionLists:
          type: array
          items:
            $ref: '#/components/schemas/DistributionLists'
    ClientDataStructure:
      type: object
      required:
        - id
        - name
        - streamIds
      properties:
        id:
          type: string
          description: Unique identifier of the structure.
        name:
          type: string
          description: Name of the structure.
        streamIds:
          type: array
          items:
            type: string
          description: List of Stream IDs in this structure.
    DistributionLists:
      type: object
      required:
        - id
        - name
        - recipients
      properties:
        id:
          type: string
          description: Unique identifier of the blast distribution list.
        name:
          type: string
          description: Name of the blast distribution list.
        recipients:
          type: array
          description: Recipients of the blast list (users and streams).
          items:
            $ref: '#/components/schemas/DistributionListRecipient'
    DistributionListRecipient:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: Identifier of the recipient (user id, stream id, or folder id).
        type:
          type: string
          description: Recipient type, e.g. "user", "stream", or "folder".
        name:
          type: string
          description: Display name of the recipient (populated with prettyName when type is "user").
        streamIds:
          type: array
          items:
            type: string
          description: List of stream IDs contained in the folder (populated when type is "folder").

    Avatar:
      type: object
      properties:
        size:
          type: string
        url:
          type: string

    UserLookup:
      type: object
      properties:
        id:
          type: integer
          format: int64
        emailAddress:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        displayName:
          type: string
        title:
          type: string
        company:
          type: string
        username:
          type: string
        location:
          type: string
        accountType:
          type: string
          enum: [NORMAL, SYSTEM, SDL]
        avatars:
          type: array
          items:
            $ref: '#/components/schemas/Avatar'
        workPhoneNumber:
          type: string
        mobilePhoneNumber:
          type: string
        jobFunction:
          type: string
        department:
          type: string
        division:
          type: string
        roles:
          type: array
          items:
            type: string
        userMetadata:
          type: object
          additionalProperties:
            type: object

    UserLookupError:
      type: object
      properties:
        error:
          type: string
        email:
          type: string
        id:
          type: string

    UserLookupList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserLookup'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UserLookupError'

    UserResponse:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        username:
          type: string
        emailAddress:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        active:
          type: boolean
        createdDate:
          type: integer
          format: int64
          description: User creation timestamp (Unix epoch milliseconds).
        roles:
          type: array
          description: Role ids of the user.
          items:
            type: string
        displayName:
          type: string
        company:
          type: string
        title:
          type: string
        department:
          type: string
        division:
          type: string
        location:
          type: string
        jobFunction:
          type: string
        workPhoneNumber:
          type: string
        mobilePhoneNumber:
          type: string
        smsNumber:
          type: string
        accountType:
          type: string
          enum: [NORMAL, SYSTEM]
        assetClasses:
          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
        marketCoverage:
          type: array
          items:
            type: string
        responsibility:
          type: array
          items:
            type: string
        function:
          type: array
          items:
            type: string
        instrument:
          type: array
          items:
            type: string
        avatars:
          type: array
          items:
            $ref: '#/components/schemas/Avatar'
        entitlements:
          type: array
          description: >-
            Names of the boolean entitlements enabled on the user.
            They may differ from the `enabledEntitlements` and `disabledEntitlements` filters, which also
            take the pod and feature level values into account.
          items:
            type: string
        createdBy:
          type: string
        lastUpdatedDate:
          type: integer
          format: int64
          description: Last update timestamp (Unix epoch milliseconds).
        lastLoginDate:
          type: integer
          format: int64
          description: Last login timestamp (Unix epoch milliseconds).
        deactivatedDate:
          type: integer
          format: int64
          description: Deactivation timestamp (Unix epoch milliseconds).
        suspended:
          type: boolean
        suspendedUntil:
          type: integer
          format: int64
          description: End of the suspension (Unix epoch milliseconds).
        suspensionReason:
          type: string

    UserArrayResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        lastUserId:
          type: integer
          format: int64
          description: Id of the last user of the page, to pass as `lastUserId` to retrieve the next page.
        hasNext:
          type: boolean
          description: True if there are more users to retrieve.
